announcement:
  enabled: true
  text: "NETT GAMES 2 IS OUT NOOOOOOOOOWW tell your friends"

# --------------------------------------------------------------
# GAMES (Nett only)
#   title:  display name
#   image:  a data: URI (svg/png/jpg all work). Placeholder below.
#   url:    where clicking the card opens (loaded inside the cloak window)
#
# LuminSDK games are NOT listed here — the site pulls those live from
# LuminSDK's own catalog (docs.luminsdk.com) when someone opens the
# "LuminSDK" tab of the game switcher. This list is Nett's games only.
# --------------------------------------------------------------
games:
  - title: "nun yet"
    image: ""
    url: "https://example.com"

# --------------------------------------------------------------
# THEMES
#   name:     shown on the preview button
#   mode:     "light" or "dark"
#   accents:  1 or 2 hex codes. First is the primary accent,
#             second (optional) is used for gradients/highlights.
# --------------------------------------------------------------
